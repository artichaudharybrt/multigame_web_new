<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below must start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Multi Games – play casino and board games online.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Multi Games">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Multi Games</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Avoid white flash + keep fullscreen game feel on mobile browsers */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b0b0f;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Ensure Flutter host fills the viewport (0-size host = black screen). */
    flutter-view, flt-glass-pane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(ellipse at center, #16161f 0%, #0b0b0f 70%);
      color: #eec283;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: opacity 0.25s ease;
    }

    #app-loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    #app-loading .brand {
      font-size: 15px;
      font-weight: 700;
      color: #f5f5f7;
      letter-spacing: 0.22em;
    }

    #app-loading .msg {
      font-size: 11px;
      color: #a8a29e;
      letter-spacing: 0.18em;
    }

    #app-loading .spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(238, 194, 131, 0.2);
      border-top-color: #eec283;
      animation: spin 0.8s linear infinite;
    }

    #app-loading button {
      margin-top: 8px;
      padding: 10px 18px;
      border: 1px solid rgba(238, 194, 131, 0.45);
      background: transparent;
      color: #eec283;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      cursor: pointer;
    }

    #app-loading .err {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 80vw;
      text-align: center;
      color: #f5f5f7;
      letter-spacing: 0.08em;
    }

    #app-loading .err small {
      color: #a8a29e;
      letter-spacing: 0;
      text-transform: none;
      word-break: break-word;
      font-size: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <script>
    // Drop stale Flutter caches so version/UI updates show up immediately.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>
  <div id="app-loading" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="brand">Multi Games</div>
    <div class="msg">Loading…</div>
  </div>
  <script src="flutter_bootstrap.js?v=2.4.2" async></script>
</body>
</html>
